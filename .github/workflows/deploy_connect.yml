name: Deploy a Posit Connect Cloud

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'data/paquetes.yaml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: app
          extra-packages: |
            rsconnect
            yaml
            shiny
            bslib
            DT
            shinyWidgets
            tidyverse

      - name: Deploy a Posit Connect Cloud
        env:
          CONNECT_API_KEY: ${{ secrets.CONNECT_API_KEY }}
          CONNECT_SERVER: https://connect.posit.cloud
          CONNECT_ACCOUNT: estacionr
        run: |
          Rscript -e "
          rsconnect::addServer(url = Sys.getenv('CONNECT_SERVER'), name = 'posit.cloud')
          rsconnect::connectApiUser(
            account  = Sys.getenv('CONNECT_ACCOUNT'),
            server   = 'posit.cloud',
            apiKey   = Sys.getenv('CONNECT_API_KEY')
          )
          rsconnect::deployApp(
            appDir   = 'app',
            server   = 'posit.cloud',
            account  = Sys.getenv('CONNECT_ACCOUNT'),
            appName  = 'catalogo-paquetes-r',
            forceUpdate = TRUE
          )
          "
